<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Z11 智能中控台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0f19; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <iframe id="z11-frame" allow="fullscreen; autoplay"></iframe>
  <script>
    (function() {
      var targetPort = 8766;
      var targetUrl = window.location.protocol + '//' + window.location.hostname + ':' + targetPort + '/' + window.location.search;
      var frame = document.getElementById('z11-frame');
      frame.src = targetUrl;
    })();
  </script>
</body>
</html>
